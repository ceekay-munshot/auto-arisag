name: Refresh dashboard data

on:
  schedule:
    # Three times a day at 8:30 AM, 2:30 PM and 8:30 PM IST.
    # IST = UTC + 05:30, so subtract 05:30: 03:00, 09:00, 15:00 UTC.
    # Note: the heavy "Backfill OEM history" step only runs on the 09:00 UTC
    # tick (2:30 PM IST) — it lines up with FADA's typical publication time,
    # and skipping it on the other two ticks shaves 5–8 minutes off those
    # runs. Lighter scrapers (RBI / macro / stocks) still fire on every tick.
    - cron: '0 3,9,15 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which scraper(s) to run. "all" = the full pipeline (same as scheduled cron). Anything else runs only that one scraper + a dashboard rebuild + commit.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rbi
          - stocks
          - macro
          - earnings
          - launches
          - ev_oem_tracker
          - raw_materials   # FRED commodity prices (refresh_raw_materials.py)
          - live_sources    # FADA + SIAM + ACMA + news (build_dashboard --refresh-live)
          - oem_history     # backfill_oem_history.py
          - fada_history    # backfill_fada_history.py
          - company_history # backfill_company_history.py
          - vahan           # refresh_vahan_playwright.py
          - siam_urls       # ingest URLs from scripts/siam_pending_urls.txt (manual)

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf openpyxl requests

      - name: Install Playwright + Chromium (Vahan scraper)
        # Only needed by scripts/refresh_vahan_playwright.py. Browser install
        # adds ~80 MB and ~60s; subsequent runs reuse the runner's cache.
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.target == 'all' || github.event.inputs.target == 'vahan' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Refresh dashboard data (FADA + SIAM + ACMA + news)
        # The "live sources" step. Runs on every scheduled tick and on
        # manual target=all / target=live_sources. For other manual targets
        # (e.g. just rbi), this is skipped — the targeted scraper still
        # rebuilds the dashboard at the end via the plain build step below.
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'live_sources' }}
        run: python -u build_dashboard.py --refresh-live

      - name: Refresh Vahan registrations (Playwright)
        # Heavy step. Scheduled: only the 09:00 UTC tick. Manual: only when
        # target == all or vahan.
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.target == 'all' || github.event.inputs.target == 'vahan' }}
        run: python -u scripts/refresh_vahan_playwright.py
        continue-on-error: true

      - name: Backfill OEM history (all categories)
        # Heavy step. Scheduled: only 09:00 UTC. Manual: only target=all/oem_history.
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.target == 'all' || github.event.inputs.target == 'oem_history' }}
        run: python -u scripts/backfill_oem_history.py
        continue-on-error: true

      - name: Backfill FADA fuel-mix + urban-rural history
        # Heavy step. Scheduled: only 09:00 UTC. Manual: only target=all/fada_history.
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.target == 'all' || github.event.inputs.target == 'fada_history' }}
        run: python -u scripts/backfill_fada_history.py
        continue-on-error: true

      # SIAM history: deepening now happens forward via update_siam itself
      # (it appends each ingested month to data/siam_history.json). The
      # listing-page scraper at scripts/extend_siam_history.py is preserved
      # but disabled — SIAM's listing page is JS-rendered, so static HTML
      # parsing finds 0 detail URLs. Re-enable here if the listing ever
      # becomes server-side-rendered again.
      # - name: Extend SIAM wholesale history
      #   if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * *'
      #   run: python -u scripts/extend_siam_history.py
      #   continue-on-error: true

      - name: Ingest SIAM URLs from siam_pending_urls.txt
        # Manual-only target. The user lists SIAM press-release URLs in
        # scripts/siam_pending_urls.txt; this step fetches each from the
        # runner (which has clean egress to siam.in unlike Claude's
        # sandbox), parses the Monthly Performance section, and merges
        # into data/siam_history.json. Idempotent — already-ingested
        # months are no-ops.
        if: ${{ github.event.inputs.target == 'siam_urls' }}
        run: python -u scripts/ingest_siam_urls.py
        continue-on-error: true

      - name: Backfill listed-OEM company history
        # Heavy step. Scheduled: only 09:00 UTC. Manual: only target=all/company_history.
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.target == 'all' || github.event.inputs.target == 'company_history' }}
        run: python -u scripts/backfill_company_history.py
        continue-on-error: true

      - name: Refresh RBI vehicle-loan credit pulse
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'rbi' }}
        run: python -u scripts/refresh_rbi_credit.py
        continue-on-error: true

      - name: Refresh macro indicators (USD/INR + fuel)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macro' }}
        run: python -u scripts/refresh_macro.py
        continue-on-error: true

      - name: Refresh listed-OEM stock prices
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'stocks' }}
        run: python -u scripts/refresh_stocks.py
        continue-on-error: true

      - name: Refresh OEM earnings calendar (NSE corporate filings)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'earnings' }}
        run: python -u scripts/refresh_earnings_calendar.py
        continue-on-error: true

      - name: Refresh recent model launches (RSS launch detector)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'launches' }}
        run: python -u scripts/refresh_launches.py
        continue-on-error: true

      - name: Refresh per-segment EV OEM leaderboard (trade-press scrape)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ev_oem_tracker' }}
        run: python -u scripts/refresh_ev_oem_tracker.py
        continue-on-error: true

      - name: Refresh raw-material monthly history (FRED commodity prices)
        # Pulls monthly Aluminum / Copper / Nickel / Lead / Iron Ore /
        # Rubber series from FRED's public CSV endpoint (no API key).
        # Persists 8+ years of monthly history into
        # data/raw_material_history.json which dashboard/analyze.py
        # then prefers over the hardcoded fallback values.
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'raw_materials' }}
        run: python -u scripts/refresh_raw_materials.py
        continue-on-error: true

      - name: Rebuild dashboard with OEM/SIAM/company history
        # The backfills may have added new months, so rebuild so the periodized
        # OEM tables, the SIAM trend chart, and the listed-company spotlight
        # all pick them up.
        run: python -u build_dashboard.py

      - name: Sync investor_dashboard.json into dist/
        run: |
          mkdir -p dist/data
          cp data/investor_dashboard.json dist/data/investor_dashboard.json

      - name: Sync static assets into dist/
        # Cloudflare Pages serves dist/ exclusively (see wrangler.jsonc
        # pages_build_output_dir). Without this step, edits to static/app.js
        # / static/styles.css / index.html stay invisible to users until
        # someone manually copies them. Mirror the source files here so the
        # cron's dashboard rebuild keeps the deployed JS / CSS in lockstep
        # with the repo. dist/ uses a flat layout (no static/ prefix), so
        # we sed the asset paths in index.html on the way in.
        run: |
          set -e
          cp static/app.js dist/app.js
          cp static/styles.css dist/styles.css
          # Strip the "static/" prefix so dist/index.html resolves locally.
          sed 's|static/styles.css|styles.css|g; s|static/app.js|app.js|g' index.html > dist/index.html

      - name: Decide whether to commit
        id: commit_check
        run: |
          # Only the snapshot files are good signals of "real" change.
          # data/investor_dashboard.json always re-renders generated_at, so we
          # can't trust its diff on its own.
          set -e
          # Stage every signal file that exists; missing files are tolerated
          # because Vahan / news refreshes can legitimately produce nothing.
          for path in data/source_snapshot.json data/news_snapshot.json data/oem_history.json data/siam_history.json data/company_unit_history.json data/rbi_credit.json data/macro_indicators.json data/oem_stocks.json data/oem_earnings_calendar.json data/launches_snapshot.json data/vahan_oem_live.json data/fada_history.json data/ev_oem_tracker.json data/raw_material_history.json; do
            if [ -f "$path" ]; then
              git add "$path"
            fi
          done
          # Stage every per-month Vahan CSV the Playwright scraper produced.
          # Each file is small (~200 maker-rows × 6 segments) and grows the
          # registration tab's history forward.
          if [ -d data/vahan ]; then
            git add 'data/vahan/*.csv' 2>/dev/null || true
          fi
          if git diff --staged --quiet; then
            echo "No source-data changes detected; skipping commit."
            echo "commit=false" >> "$GITHUB_OUTPUT"
            # Roll back the rebuilt JSONs / synced assets so we don't leave
            # noise behind on the runner working tree.
            git checkout -- data/investor_dashboard.json dist/data/investor_dashboard.json dist/app.js dist/styles.css dist/index.html 2>/dev/null || true
          else
            echo "Source-data changes detected; will commit."
            echo "commit=true" >> "$GITHUB_OUTPUT"
            git add data/investor_dashboard.json dist/data/investor_dashboard.json
            # Pick up any drift in dist/ static assets too so the deployed
            # JS / CSS / HTML stays in lockstep with static/ + index.html.
            git add dist/app.js dist/styles.css dist/index.html
          fi

      - name: Commit and push
        if: steps.commit_check.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): scheduled dashboard refresh

          Triggered by ${{ github.event_name }} on $(date -u +%Y-%m-%dT%H:%MZ)."
          git push
